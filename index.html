<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ここはどこ？（デバッグ版）</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      cursor: pointer;
    }
    #uiContainer {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      pointer-events: none;
      width: 100%;
    }
    body.active #uiContainer {
      opacity: 1;
      visibility: visible;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 10px 0;
      color: #007aff;
    }
    #status {
      font-size: 1.1rem;
      color: #34c759;
      max-width: 90vw;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.08);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      word-break: break-all;
    }
    #hint {
      position: absolute;
      bottom: 30px;
      font-size: 0.85rem;
      color: #444444;
      pointer-events: none;
    }
  </style>
</head>
<body id="bodyTag">

  <div id="screen" onclick="handleTap()">
    <div id="uiContainer">
      <h1>ここはどこ？</h1>
      <div id="status">待機中...</div>
    </div>
    <div id="hint">画面のどこでもタップ</div>
  </div>

  <script>
    const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";
    let isBusy = false;

    function handleTap() {
      if (isBusy) return;
      isBusy = true;

      document.getElementById('bodyTag').classList.add('active');
      setStatus("GPS信号を検索中...");
      playBeep();

      if (!navigator.geolocation) {
        finishSession("エラー: Geolocation API非対応ブラウザ");
        return;
      }

      // 成功・失敗の詳細を捉えるため、タイムアウトを15秒に拡大、高精度を有効化
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          setStatus(`GPS取得成功\n緯度:${lat.toFixed(4)}, 経度:${lng.toFixed(4)}\n住所を変換中...`);

          if (GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY !== "YOUR_GOOGLE_MAPS_API_KEY") {
            await fetchGoogleAddress(lat, lng);
          } else {
            await fetchFallbackAddress(lat, lng);
          }
        },
        (error) => {
          let errMessage = "不明なエラー";
          switch(error.code) {
            case error.PERMISSION_DENIED:
              errMessage = "位置情報の利用が拒否されました（設定を確認してください）";
              break;
            case error.POSITION_UNAVAILABLE:
              errMessage = "位置情報が取得できません（GPS電波不良）";
              break;
            case error.TIMEOUT:
              errMessage = "位置情報の取得がタイムアウトしました";
              break;
          }
          finishSession(`取得失敗 [code ${error.code}]:\n${errMessage}`);
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function setStatus(text) {
      document.getElementById('status').innerText = text;
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    async function fetchGoogleAddress(lat, lng) {
      const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=ja`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === "OK" && data.results.length > 0) {
          const rawAddress = data.results[0].formatted_address;
          const cleanAddress = rawAddress.replace(/^日本、?/, '').replace(/〒\d{3}-\d{4}\s?/, '');
          setStatus(cleanAddress);
          speakAndFadeOut(`ここは、${cleanAddress} 付近です。`);
        } else {
          finishSession(`住所変換エラー: ${data.status}`);
        }
      } catch (e) {
        finishSession("通信エラー: Google APIに接続できません");
      }
    }

    async function fetchFallbackAddress(lat, lng) {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ja`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const address = data.display_name || "住所不明";
        setStatus(address);
        speakAndFadeOut(`ここは、${address} 付近です。`);
      } catch (e) {
        finishSession("通信エラー: OSMに接続できません");
      }
    }

    function speakAndFadeOut(text) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.05;
      uttr.onend = () => resetScreen();
      uttr.onerror = () => resetScreen();
      window.speechSynthesis.speak(uttr);
    }

    function finishSession(msg) {
      setStatus(msg);
      speakAndFadeOut(msg);
    }

    function resetScreen() {
      document.getElementById('bodyTag').classList.remove('active');
      isBusy = false;
    }
  </script>
</body>
</html>
