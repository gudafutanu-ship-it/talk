<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ここはどこ？（ダークモード版）</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000; /* 完全に真っ黒（省電力・OLED画面保護） */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* 画面全体をタッチ受付エリアにする */
    #screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      cursor: pointer;
    }

    /* 普段は非表示（真っ黒）にし、タップ時にフワッと現れるUIコンテナ */
    #uiContainer {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* アクティブ時（タッチ中・音声案内中）に表示状態にするクラス */
    body.active #uiContainer {
      opacity: 1;
      visibility: visible;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0 0 15px 0;
      color: #007aff;
    }
    #status {
      font-size: 1.25rem;
      color: #34c759;
      max-width: 85vw;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 画面が暗いときのうっすらとしたガイド（消すことも可能） */
    #hint {
      position: absolute;
      bottom: 30px;
      font-size: 0.85rem;
      color: #333333; /* ほぼ見えない薄いグレー */
      pointer-events: none;
    }
  </style>
</head>
<body id="bodyTag">

  <div id="screen" onclick="handleTap()">
    <div id="uiContainer">
      <h1>ここはどこ？</h1>
      <div id="status">現在地を確認しています...</div>
    </div>
    <div id="hint">画面のどこでもタップ</div>
  </div>

  <script>
    // ※ Google Maps API Key をお持ちの場合はここに設定してください
    const GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

    let isBusy = false;

    // タップされたときのメイン処理
    function handleTap() {
      if (isBusy) return; // 処理中は連続入力をガード
      isBusy = true;

      // 1. 画面をアクティブ（UIを表示）にする
      document.getElementById('bodyTag').classList.add('active');
      document.getElementById('status').innerText = "現在地を取得中...";

      // 2. タップ直後にイヤホンへ即時ビープ音を返す（操作確認）
      playBeep();

      // 3. 位置情報の取得開始
      if (!navigator.geolocation) {
        finishSession("位置情報がサポートされていません");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if (GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY !== "YOUR_GOOGLE_MAPS_API_KEY") {
            await fetchGoogleAddress(lat, lng);
          } else {
            await fetchFallbackAddress(lat, lng);
          }
        },
        (error) => {
          finishSession("位置情報の取得に失敗しました");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // イヤホンへの確認用ビープ音
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    // Google Maps Geocoding API
    async function fetchGoogleAddress(lat, lng) {
      const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}&language=ja`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === "OK" && data.results.length > 0) {
          const rawAddress = data.results[0].formatted_address;
          const cleanAddress = rawAddress.replace(/^日本、?/, '').replace(/〒\d{3}-\d{4}\s?/, '');
          const speechText = `ここは、${cleanAddress} 付近です。`;
          document.getElementById('status').innerText = cleanAddress;
          speakAndFadeOut(speechText);
        } else {
          finishSession("住所が見つかりませんでした");
        }
      } catch (e) {
        finishSession("通信エラーが発生しました");
      }
    }

    // APIキーなしのフォールバック (OpenStreetMap)
    async function fetchFallbackAddress(lat, lng) {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ja`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const address = data.display_name || "住所不明";
        const speechText = `ここは、${address} 付近です。`;
        document.getElementById('status').innerText = address;
        speakAndFadeOut(speechText);
      } catch (e) {
        finishSession("住所取得エラーです");
      }
    }

    // 音声読み上げを行い、読み終わったら自動で画面を真っ暗に戻す
    function speakAndFadeOut(text) {
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'ja-JP';
      uttr.rate = 1.05;

      // 読み上げが終了したタイミングで画面を真っ黒に戻す
      uttr.onend = () => {
        resetScreen();
      };
      // 万が一エラー等で止まった場合の保険（5秒後に自動消灯）
      uttr.onerror = () => {
        resetScreen();
      };

      window.speechSynthesis.speak(uttr);
    }

    // 即座に終了して画面を真っ黒に戻す関数
    function finishSession(msg) {
      document.getElementById('status').innerText = msg;
      speakAndFadeOut(msg);
    }

    // 画面を真っ黒（省電力）の状態に戻す
    function resetScreen() {
      document.getElementById('bodyTag').classList.remove('active');
      isBusy = false;
    }
  </script>
</body>
</html>
